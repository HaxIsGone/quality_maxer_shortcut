[mod-name]
quality_maxer_shortcut=Quality maxer - shortcut

[mod-description]
quality_maxer_shortcut=Adds a shortcut that sets blueprint entities, cursor ghost, and upgrade planner mappings to the highest available quality.

[shortcut-name]
quality-maxer-shortcut-apply=Max quality
quality-maxer-shortcut-upgrade-any-quality=Any quality (upgrade planner)

[shortcut-description]
quality-maxer-shortcut-apply=Set blueprint entities, cursor ghost, and upgrade planner mappings to the highest available quality tier.
quality-maxer-shortcut-upgrade-any-quality=Set the hovered upgrade planner entity or item quality to Any quality.

[controls]
quality-maxer-shortcut-apply=Apply max quality to blueprint/ghost/planner
quality-maxer-shortcut-upgrade-any-quality=Set hovered upgrade planner quality to Any quality

[quality-maxer-shortcut]
applied=Set target quality to __1__ on __2__ entries.
no-target=No supported blueprint/ghost/upgrade planner target found.
no-quality=No quality prototype is available.
